spring.application.name=mini-dmart-backend

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=8081

# ---------------------------------------------------------------
# MySQL database
# Every value can be overridden with an environment variable, e.g.
#   DB_PASSWORD=mysecret mvn spring-boot:run
# The database is created automatically if it does not exist yet.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mini_dmart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# JWT  (use a long random secret of at least 32 characters in production)
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:9a2f8c4e1b7d3a5f8e6c4b2a9d7e1f3a5b8c6d4e2f0a8b6c4d2e0f8a6b4c2d0e}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------
# CORS - origins allowed to call the API (comma separated patterns)
# ---------------------------------------------------------------
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ---------------------------------------------------------------
# Seed some demo products when the products table is empty
# ---------------------------------------------------------------
app.seed-sample-products=true
